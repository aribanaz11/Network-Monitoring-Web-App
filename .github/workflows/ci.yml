name: NetWatch Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Backend Test Suite & Linting
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: netwatch_test_db
          POSTGRES_USER: netwatch_user
          POSTGRES_PASSWORD: netwatch_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Database Migrations
        env:
          USE_SQLITE: "True"
          DJANGO_SECRET_KEY: "ci-secret-key-test-environment"
          FERNET_KEY: "W3sO-LqP7b_dG5vUv-0L2Y1t9kLpM_xZ7sQ2dF4jK8M="
        run: |
          python backend/manage.py migrate

      - name: Run Automated Pytest Suite
        env:
          USE_SQLITE: "True"
          DJANGO_SECRET_KEY: "ci-secret-key-test-environment"
          FERNET_KEY: "W3sO-LqP7b_dG5vUv-0L2Y1t9kLpM_xZ7sQ2dF4jK8M="
          CELERY_TASK_ALWAYS_EAGER: "True"
          KAFKA_ENABLED: "False"
        run: |
          pytest backend/tests -v --tb=short

  docker-build:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
