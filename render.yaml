services:
  - type: web
    name: netwatch-monitoring-app
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: "pip install -r requirements.txt && python backend/manage.py collectstatic --no-input && python backend/manage.py migrate && python backend/manage.py seed_network_demo"
    startCommand: "gunicorn --chdir backend netwatch_core.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: USE_SQLITE
        value: "True"
      - key: SIMULATOR_MODE
        value: "True"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: KAFKA_ENABLED
        value: "False"
      - key: MONGODB_ENABLED
        value: "False"
      - key: FERNET_KEY
        generateValue: true
      - key: DJANGO_SECRET_KEY
        generateValue: true
