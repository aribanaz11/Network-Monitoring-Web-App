version: '3.8'

services:
  # Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: netwatch_postgres
    environment:
      POSTGRES_DB: netwatch_db
      POSTGRES_USER: netwatch_user
      POSTGRES_PASSWORD: netwatch_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netwatch_user -d netwatch_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Document Telemetry Store
  mongodb:
    image: mongo:7.0
    container_name: netwatch_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # In-Memory Cache & Celery Broker
  redis:
    image: redis:7-alpine
    container_name: netwatch_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Message Broker for Distributed Worker Tasks
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: netwatch_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: netwatch_rabbit
      RABBITMQ_DEFAULT_PASS: netwatch_rabbit_pass
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Event Streaming: Zookeeper + Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: netwatch_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: netwatch_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

volumes:
  pgdata:
  mongodata:
