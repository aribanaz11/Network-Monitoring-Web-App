version: '3.8'

services:
  # 1. Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: netwatch_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-netwatch_db}
      POSTGRES_USER: ${DB_USER:-netwatch_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-netwatch_dev_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-netwatch_user} -d ${DB_NAME:-netwatch_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Document Telemetry Store
  mongodb:
    image: mongo:7.0
    container_name: netwatch_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. In-Memory Cache & Circuit Breaker State
  redis:
    image: redis:7-alpine
    container_name: netwatch_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Message Broker for Distributed Worker Tasks
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: netwatch_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Management Dashboard
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-netwatch_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-netwatch_rabbit_dev_pass}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. Event Streaming: Zookeeper + Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: netwatch_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: netwatch_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  # 6. Django REST Application & UI Web Server
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: netwatch_web
    command: gunicorn netwatch_core.wsgi:application --bind 0.0.0.0:8000 --workers 2
    ports:
      - "8000:8000"
    environment:
      - USE_SQLITE=False
      - DB_NAME=${DB_NAME:-netwatch_db}
      - DB_USER=${DB_USER:-netwatch_user}
      - DB_PASSWORD=${DB_PASSWORD:-netwatch_dev_password}
      - DB_HOST=postgres
      - DB_PORT=5432
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-amqp://netwatch_rabbit:netwatch_rabbit_dev_pass@rabbitmq:5672//}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/}
      - MONGODB_ENABLED=${MONGODB_ENABLED:-True}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      - FERNET_KEY=${FERNET_KEY:-}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 7. Distributed Celery Asynchronous Task Worker
  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: netwatch_celery_worker
    command: celery -A netwatch_core worker -l INFO -Q high_priority_icmp,snmp_telemetry,automation_jobs,default --concurrency=4
    environment:
      - USE_SQLITE=False
      - DB_NAME=${DB_NAME:-netwatch_db}
      - DB_USER=${DB_USER:-netwatch_user}
      - DB_PASSWORD=${DB_PASSWORD:-netwatch_dev_password}
      - DB_HOST=postgres
      - DB_PORT=5432
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-amqp://netwatch_rabbit:netwatch_rabbit_dev_pass@rabbitmq:5672//}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/}
      - MONGODB_ENABLED=${MONGODB_ENABLED:-True}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      - FERNET_KEY=${FERNET_KEY:-}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 8. Celery Beat Periodic Monitoring Scheduler
  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: netwatch_celery_beat
    command: celery -A netwatch_core beat -l INFO
    environment:
      - USE_SQLITE=False
      - DB_NAME=${DB_NAME:-netwatch_db}
      - DB_USER=${DB_USER:-netwatch_user}
      - DB_PASSWORD=${DB_PASSWORD:-netwatch_dev_password}
      - DB_HOST=postgres
      - DB_PORT=5432
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-amqp://netwatch_rabbit:netwatch_rabbit_dev_pass@rabbitmq:5672//}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  mongodata:
